<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>方向 A｜Industrial Editorial</title>
  <style>
    :root{--ink:#18211f;--paper:#f3f0e9;--line:#c8c1b4;--orange:#e46332;--muted:#68706b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}
    .board{width:min(1440px,100%);margin:auto;min-height:100vh;padding:42px 6vw 70px;position:relative;overflow:hidden}
    .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    .mark{font-weight:800;letter-spacing:.05em}.lang{color:var(--muted)}
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:8vw;padding:92px 0 72px;align-items:center}
    h1{font-size:clamp(48px,7vw,104px);line-height:.94;letter-spacing:-.08em;margin:0 0 30px;max-width:700px}
    .intro{font-size:19px;line-height:1.65;max-width:490px;color:#4e5752}.eyebrow{color:var(--orange);font-weight:700;letter-spacing:.13em;font-size:12px;margin-bottom:20px}
    .button{display:inline-block;margin-top:30px;background:var(--orange);color:#fff;padding:15px 23px;font-weight:700;text-decoration:none}
    .visual{min-height:430px;background:#263330;position:relative;isolation:isolate;overflow:hidden}.visual:before{content:"";position:absolute;inset:12% 8%;border:1px solid #b9c3bc55;transform:skewY(-14deg);box-shadow:0 0 0 18px #ffffff05,0 0 0 42px #ffffff03}.visual:after{content:"TEMPORARY IMAGE PLACEHOLDER";position:absolute;left:28px;bottom:24px;color:#fff9;font:11px monospace;letter-spacing:.12em}
    .plate{position:absolute;background:var(--orange);width:170px;height:170px;right:12%;top:19%;clip-path:polygon(16% 0,100% 0,84% 100%,0 100%);opacity:.92}.ring{position:absolute;width:230px;height:230px;border:1px solid #d8ddd5aa;border-radius:50%;right:24%;bottom:9%}.grid{position:absolute;inset:0;background:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(135deg,transparent 25%,#000 70%);opacity:.7}
    .strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:19px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.strip strong{display:block;font-size:28px}.strip span{color:var(--muted);font-size:12px;letter-spacing:.08em}
    .note{position:absolute;right:6vw;bottom:20px;color:var(--muted);font-size:11px}.swatches{display:flex;gap:6px;margin-top:22px}.swatches i{display:block;width:25px;height:8px;background:var(--ink)}.swatches i:nth-child(2){background:var(--orange)}.swatches i:nth-child(3){background:#c8c1b4}
    @media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:60px}.visual{min-height:300px}.strip{grid-template-columns:1fr 1fr}h1{font-size:60px}}
  </style>
</head>
<body><main class="board"><div class="top"><div class="mark">BALENDA / AUTOMATION</div><div class="lang">中文 · English · Русский</div></div><section class="hero"><div><div class="eyebrow">DIRECTION A / INDUSTRIAL EDITORIAL</div><h1>让每一次<br>称量可控。</h1><p class="intro">用清晰的行业问题、产品证据与工程服务，讲清楚一套自动化称重方案如何落到现场。</p><a class="button" href="#">查看解决方案 ↗</a><div class="swatches"><i></i><i></i><i></i></div></div><div class="visual"><div class="grid"></div><div class="plate"></div><div class="ring"></div></div></section><div class="strip"><div><strong>01</strong><span>行业问题先行</span></div><div><strong>02</strong><span>工程证据支撑</span></div><div><strong>03</strong><span>快速联系工程师</span></div></div><div class="note">静帧关键词：克制、可信、工程编辑感</div></main></body>
</html>
