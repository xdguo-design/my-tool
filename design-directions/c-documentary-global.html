<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向 C｜Documentary Global</title>
  <style>
    :root{--ink:#151515;--paper:#e9e6df;--red:#bb4b35;--blue:#315a66;--gray:#676763}.board{width:min(1440px,100%);margin:auto;min-height:100vh;background:var(--paper);color:var(--ink);padding:32px 6vw 70px;font-family:Georgia,"Songti SC",serif;position:relative;overflow:hidden}*{box-sizing:border-box}.top{display:flex;justify-content:space-between;border-bottom:1px solid #15151555;padding-bottom:15px;font:11px Arial,"Microsoft YaHei",sans-serif;letter-spacing:.16em;text-transform:uppercase}.brand{font-weight:bold}.hero{display:grid;grid-template-columns:.82fr 1.18fr;gap:5vw;padding:74px 0 58px;align-items:stretch}.eyebrow{font:11px Arial,"Microsoft YaHei",sans-serif;color:var(--red);letter-spacing:.15em;margin-bottom:24px}h1{font-weight:400;font-size:clamp(50px,7vw,106px);line-height:.93;letter-spacing:-.08em;margin:0 0 28px}p{font:18px/1.7 Arial,"Microsoft YaHei",sans-serif;color:var(--gray);max-width:410px}.cta{display:inline-block;margin-top:27px;border-bottom:2px solid var(--red);padding-bottom:9px;font:700 13px Arial,"Microsoft YaHei",sans-serif;color:var(--ink);text-decoration:none}.photo{min-height:470px;position:relative;background:linear-gradient(135deg,#8a908b 0 35%,#434b4a 35% 68%,#c0b49e 68%);filter:saturate(.7)}.photo:before{content:"";position:absolute;inset:10% 12%;border:1px solid #ffffff80;transform:rotate(3deg)}.photo:after{content:"TEMPORARY FACTORY / PROJECT IMAGE";position:absolute;left:24px;bottom:20px;font:11px monospace;letter-spacing:.1em;color:#fff}.caption{position:absolute;left:10%;top:8%;color:#fff;font:11px Arial,sans-serif;letter-spacing:.1em}.bar{background:var(--red);width:48%;height:19px;position:absolute;right:8%;top:42%}.bar:after{content:"";display:block;background:var(--blue);width:55%;height:19px;position:absolute;right:-45%;top:30px}.proof{border-top:1px solid #15151555;padding-top:19px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:22px;font-family:Arial,"Microsoft YaHei",sans-serif}.proof strong{font:26px Georgia,serif}.proof span{display:block;color:var(--gray);font-size:12px;line-height:1.5;margin-top:6px}.note{position:absolute;right:6vw;bottom:18px;font:11px Arial,sans-serif;color:var(--gray)}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:55px}.photo{min-height:300px}.proof{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main class="board"><div class="top"><div class="brand">BALENDA / ENGINEERING PARTNER</div><div>中文 · English · Русский</div></div><section class="hero"><div><div class="eyebrow">DIRECTION C / DOCUMENTARY GLOBAL</div><h1>把工艺<br>交给证据。</h1><p>以真实工厂、项目现场、客户行业与工程师内容建立信任；多语言首页更像一个可以被全球客户理解的企业档案。</p><a class="cta" href="#">浏览项目与案例 →</a></div><div class="photo"><div class="caption">IMAGE PLACEHOLDER / REPLACE WITH LICENSED ASSET</div><div class="bar"></div></div></section><div class="proof"><div><strong>现场优先</strong><span>用工程照片替代抽象装饰，突出设备如何工作。</span></div><div><strong>全球可读</strong><span>语言切换、区域联系方式与下载资料并列。</span></div><div><strong>案例驱动</strong><span>每个案例绑定行业、问题、方案和结果。</span></div></div><div class="note">静帧关键词：真实、国际、长期合作</div></main></body>
</html>
