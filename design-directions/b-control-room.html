<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向 B｜Control Room</title>
  <style>
    :root{--bg:#101b26;--panel:#172938;--line:#365167;--cyan:#8adbe0;--amber:#f0ad5e;--white:#e9f0f1;--muted:#9db0b8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,"Microsoft YaHei",sans-serif}.board{min-height:100vh;padding:34px 6vw 60px;position:relative;overflow:hidden}.board:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 48%,#8adbe00c 48.1% 48.2%,transparent 48.3%),linear-gradient(0deg,transparent 0 70%,#f0ad5e0b 70.1% 70.2%,transparent 70.3%);pointer-events:none}
    .top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:19px;color:var(--muted);font:12px monospace;letter-spacing:.12em}.logo{color:var(--white);font-weight:bold}.hero{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:7vw;padding:95px 0 86px;align-items:center}.eyebrow{font:12px monospace;color:var(--cyan);letter-spacing:.16em;margin-bottom:22px}h1{font-size:clamp(48px,7vw,104px);line-height:.96;letter-spacing:-.08em;margin:0 0 28px}p{font-size:18px;line-height:1.6;color:var(--muted);max-width:500px}.cta{display:flex;gap:12px;margin-top:30px}.btn{border:1px solid var(--cyan);color:var(--cyan);padding:14px 20px;text-decoration:none;font-weight:bold}.btn.alt{border-color:var(--line);color:var(--white)}
    .console{background:var(--panel);border:1px solid var(--line);padding:19px;min-height:405px;position:relative;box-shadow:22px 22px 0 #0b131b}.console-head{display:flex;justify-content:space-between;color:var(--muted);font:11px monospace;border-bottom:1px solid var(--line);padding-bottom:13px}.status{color:var(--cyan)}.diagram{height:260px;position:relative;margin:20px 0}.node{position:absolute;width:118px;height:62px;border:1px solid var(--cyan);display:grid;place-items:center;font:12px monospace;color:var(--cyan);background:#11222d}.node.a{left:0;top:86px}.node.b{left:38%;top:23px}.node.c{right:0;top:134px;border-color:var(--amber);color:var(--amber)}.wire{position:absolute;height:1px;background:var(--cyan);transform-origin:left center}.wire.one{left:118px;top:120px;width:145px;transform:rotate(-25deg)}.wire.two{left:53%;top:76px;width:155px;transform:rotate(25deg);background:var(--amber)}.pulse{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--amber);top:72px;left:52%;box-shadow:0 0 0 8px #f0ad5e22}.console-foot{display:flex;justify-content:space-between;color:var(--muted);font:11px monospace}.readout{color:var(--amber);font-size:24px}.metrics{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.metrics strong{font:32px monospace;color:var(--cyan)}.metrics span{display:block;color:var(--muted);font-size:12px;margin-top:7px}.note{position:absolute;right:6vw;bottom:18px;color:var(--muted);font-size:11px}
    @media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:60px}.console{min-height:350px}.metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main class="board"><div class="top"><div class="logo">BALENDA / PROCESS CONTROL</div><div>ZH-CN · EN · RU</div></div><section class="hero"><div><div class="eyebrow">DIRECTION B / CONTROL ROOM</div><h1>从传感器<br>到现场。</h1><p>用连续的数据链路表达称重、给料、控制与远程服务，让客户一眼看懂系统如何接入工厂。</p><div class="cta"><a class="btn" href="#">系统方案 ↗</a><a class="btn alt" href="#">工程支持</a></div></div><div class="console"><div class="console-head"><span>FIELD / WEIGHING NETWORK</span><span class="status">● ONLINE</span></div><div class="diagram"><div class="node a">LOAD CELL</div><div class="node b">CONTROLLER</div><div class="node c">PLC / IIoT</div><div class="wire one"></div><div class="wire two"></div><div class="pulse"></div></div><div class="console-foot"><span>PROTOTYPE VISUAL</span><span class="readout">98.6%</span></div></div></section><div class="metrics"><div><strong>01</strong><span>流程可视化</span></div><div><strong>02</strong><span>接入逻辑清晰</span></div><div><strong>03</strong><span>支持入口前置</span></div></div><div class="note">静帧关键词：技术、连接、可视化</div></main></body>
</html>
